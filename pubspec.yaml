name: rahhala_app
description: "Rahhala App is a production-ready cross-platform travel companion built with Flutter, Clean Architecture, and BLoC/Cubit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  dartz: ^0.10.1
  dio: ^5.9.0
  elegant_notification: ^2.5.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  get_it: ^8.2.0
  go_router: ^16.3.0
  image_picker: ^1.2.0
  lottie: ^3.3.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  logger: ^2.6.1
  smooth_page_indicator: ^1.2.1
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  camera: ^0.10.5+9
  photo_manager: ^3.0.0
  timeago: ^3.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

flutter_assets:
  assets_path: assets/
  output_path: lib/core/constants/
  filename: assets.dart

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"